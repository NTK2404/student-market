spring.application.name=student-market

# --- Database (sửa user/password cho máy của bạn) ---
spring.datasource.url=jdbc:mysql://localhost:3306/student_market?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ĐÃ SỬA: Bật thành true để giữ kết nối Database cho giao diện Thymeleaf gọi các dữ liệu liên kết
spring.jpa.open-in-view=true

# --- Upload ảnh ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
app.upload-dir=uploads

# --- Dev ---
spring.thymeleaf.cache=false

app.base-url=http://localhost:8080
spring.config.import=optional:file:./application-local.properties