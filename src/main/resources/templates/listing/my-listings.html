<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head('Tin của tôi')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{layout/layout :: header}"></div>

<main class="container flex-grow-1 py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Tin đăng của tôi</h2>
        <a th:href="@{/listings/create}" class="btn btn-primary">+ Đăng tin mới</a>
    </div>

    <!-- DANH SÁCH BÀI ĐĂNG CỦA CÁ NHÂN -->
    <div class="row row-cols-1 row-cols-md-3 g-4" th:if="${listings != null}">
        <div class="col" th:each="listing : ${listings}">
            <div class="card h-100 shadow-sm border-0">
                <div class="bg-white d-flex align-items-center justify-content-center border-bottom" style="height: 200px;">
                    <a th:href="@{|/listings/${listing.id}|}" class="text-decoration-none">Chưa có ảnh</a>
                </div>
                <div class="card-body">
                    <h5 class="card-title text-truncate mb-1" th:text="${listing.title != null ? listing.title : 'Chưa có tiêu đề'}">Tiêu đề</h5>
                    <h6 class="card-subtitle mb-2 text-danger fw-bold" th:text="${listing.price != null ? #numbers.formatInteger(listing.price, 1, 'COMMA') + ' đ' : 'Thỏa thuận'}">Giá</h6>
                    <p class="card-text small text-muted mb-3" th:text="${(listing.itemCondition != null ? listing.itemCondition : 'Chưa cập nhật tình trạng') + ' · ' + (listing.location != null ? listing.location : 'Chưa có địa điểm')}">Tình trạng · Địa điểm</p>
                </div>
                <!-- Nút thao tác riêng cho chủ bài đăng -->
                <div class="card-footer bg-white border-top-0 d-flex gap-2 pb-3">
                    <a th:href="@{|/listings/edit/${listing.id}|}" class="btn btn-sm btn-outline-primary flex-grow-1">Sửa</a>
                    <a th:href="@{|/listings/delete/${listing.id}|}" class="btn btn-sm btn-outline-danger flex-grow-1" onclick="return confirm('Bạn có chắc chắn muốn xóa tin này không?')">Xóa</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Hiển thị khi chưa có bài đăng nào -->
    <div th:if="${listings == null or (listings.class.name.contains('Page') ? listings.totalElements == 0 : listings.size() == 0)}">
        <div class="text-center mt-5">
            <p class="text-muted mb-3">Bạn chưa đăng tin rao bán nào.</p>
        </div>
    </div>

</main>

<div th:replace="~{layout/layout :: footer}"></div>
<th:block th:replace="~{layout/layout :: scripts}"></th:block>
</body>
</html>
