<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head('Đăng tin rao bán')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{layout/layout :: header}"></div>

<div class="container mt-4 mb-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white pb-2 pt-3">
                    <h4 class="mb-0">Đăng tin rao bán</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/listings/create}" method="post" enctype="multipart/form-data">

                        <div class="mb-3">
                            <label class="form-label">Tiêu đề tin đăng <span class="text-danger">*</span></label>
                            <input type="text" name="title" class="form-control" required placeholder="Ví dụ: Bán lại sách Giải tích 1...">
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Giá bán (VNĐ) <span class="text-danger">*</span></label>
                                <input type="number" name="price" class="form-control" required value="0" min="0">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Tình trạng <span class="text-danger">*</span></label>
                                <select name="itemCondition" class="form-select" required>
                                    <option value="">-- Chọn tình trạng --</option>
                                    <!-- Sửa value thành tiếng Anh để khớp với Enum ItemCondition trong Backend -->
                                    <!-- Nếu Enum của bạn khác (VD: LIKE_NEW, OLD), hãy mở file ItemCondition.java ra xem và sửa lại value ở đây cho khớp -->
                                    <option value="NEW">Mới</option>
                                    <option value="USED">Đã sử dụng</option>
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Danh mục <span class="text-danger">*</span></label>
                                <select name="category.id" class="form-select" required>
                                    <option value="">-- Chọn danh mục --</option>
                                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}">Tên danh mục</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Địa điểm <span class="text-danger">*</span></label>
                                <input type="text" name="location" class="form-control" required placeholder="Ví dụ: KTX Khu A, ĐHQG...">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Hình ảnh sản phẩm (có thể chọn nhiều ảnh) <span class="text-danger">*</span></label>
                            <!-- Đổi name thành imageFiles để tránh trùng với biến images trong Listing.java -->
                            <input type="file" name="imageFiles" class="form-control" multiple accept="image/*">
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Mô tả chi tiết <span class="text-danger">*</span></label>
                            <textarea name="description" class="form-control" rows="5" required placeholder="Mô tả tình trạng sản phẩm, lý do bán..."></textarea>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">Đăng tin</button>
                            <a th:href="@{/}" class="btn btn-outline-secondary">Hủy bỏ</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/layout :: footer}"></div>
<th:block th:replace="~{layout/layout :: scripts}"></th:block>
</body>
</html>
