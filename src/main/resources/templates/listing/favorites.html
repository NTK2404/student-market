<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head('Tin yêu thích')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{layout/layout :: header}"></div>

<main class="container flex-grow-1 py-4">
    <div class="mb-4">
        <h2>Tin yêu thích của tôi</h2>
    </div>

    <!-- DANH SÁCH BÀI ĐĂNG YÊU THÍCH -->
    <div class="row row-cols-1 row-cols-md-3 g-4" th:if="${listings != null}">
        <div class="col" th:each="listing : ${listings}" th:with="lx=${@listingDisplay.info(listing.id)}">
            <div class="card h-100 shadow-sm border-0 overflow-hidden">
                <a th:href="@{/listings/{id}(id=${listing.id})}" class="bg-white d-flex align-items-center justify-content-center border-bottom text-decoration-none" style="height: 200px;">
                    <img th:if="${lx != null and lx.primaryImage != null}" th:src="@{${lx.primaryImage}}" class="w-100 h-100" style="object-fit: cover;" alt="Ảnh tin đăng">
                    <span th:unless="${lx != null and lx.primaryImage != null}" class="text-muted small">Chưa có ảnh</span>
                </a>
                <div class="card-body">
                    <h5 class="card-title text-truncate mb-1" th:text="${listing.title != null ? listing.title : 'Chưa có tiêu đề'}">Tiêu đề</h5>
                    <h6 class="card-subtitle mb-2 text-danger fw-bold" th:text="${listing.price != null ? #numbers.formatInteger(listing.price, 1, 'COMMA') + ' đ' : 'Thỏa thuận'}">Giá</h6>
                </div>
                <!-- ĐÃ THÊM: Nút xóa khỏi danh sách yêu thích -->
                <div class="card-footer bg-white border-top-0 d-flex gap-2 pb-3">
                    <a th:href="@{/listings/{id}(id=${listing.id})}" class="btn btn-outline-primary flex-grow-1">Xem chi tiết</a>
                    <form th:action="@{/favorites/remove/{id}(id=${listing.id})}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-danger" title="Xóa khỏi yêu thích">X</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${listings == null or #lists.isEmpty(listings)}">
        <div class="text-center mt-5">
            <p class="text-muted mb-3">Bạn chưa có bài đăng nào trong danh sách yêu thích.</p>
        </div>
    </div>
</main>

<div th:replace="~{layout/layout :: footer}"></div>
<th:block th:replace="~{layout/layout :: scripts}"></th:block>
</body>
</html>
