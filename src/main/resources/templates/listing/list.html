<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head('Tin đăng')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{layout/layout :: header}"></div>

<main class="container flex-grow-1 py-4">
    <h2 class="mb-4">Tin đăng</h2>

    <!-- BỘ LỌC TÌM KIẾM -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/listings}" method="get" class="row g-3 align-items-end">

                <div class="col-md-4">
                    <label class="form-label text-muted small mb-1">Từ khóa</label>
                    <input type="text" name="keyword" class="form-control" th:value="${keyword}" placeholder="Giáo trình, laptop, xe đạp...">
                </div>

                <div class="col-md-3">
                    <label class="form-label text-muted small mb-1">Danh mục</label>

                    <!-- Tự động lọc khi vừa chọn danh mục -->
                    <select name="categoryId" class="form-select" onchange="this.form.submit()">
                        <option value="" th:selected="${categoryId == null}">Tất cả</option>

                        <option th:each="c : ${categories}"
                                th:value="${c.id}"
                                th:text="${c.name}"
                                th:selected="${categoryId != null and categoryId.toString() == c.id.toString()}">
                            Danh mục
                        </option>
                    </select>
                </div>

                <div class="col-md-2">
                    <label class="form-label text-muted small mb-1">Giá từ</label>
                    <input type="number" name="minPrice" class="form-control" th:value="${minPrice}">
                </div>

                <div class="col-md-2">
                    <label class="form-label text-muted small mb-1">Đến</label>
                    <input type="number" name="maxPrice" class="form-control" th:value="${maxPrice}">
                </div>

                <div class="col-md-1">
                    <button type="submit" class="btn btn-primary w-100">Lọc</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tự động đếm số lượng bài đăng -->
    <p class="text-muted mb-3" th:if="${listings != null}">
        <span th:text="${listings.class.name.contains('Page') ? listings.totalElements : listings.size()}"></span> tin đăng
    </p>

    <!-- DANH SÁCH BÀI ĐĂNG -->
    <div class="row row-cols-1 row-cols-md-3 g-4" th:if="${listings != null}">

        <!-- ĐÃ SỬA: Gọi thêm biến lx từ @listingDisplay để lấy ảnh đại diện của từng tin đăng -->
        <div class="col" th:each="listing : ${listings}" th:with="lx=${@listingDisplay.info(listing.id)}">
            <div class="card h-100 shadow-sm border-0 overflow-hidden">

                <!-- ĐÃ SỬA: Hiển thị ảnh nếu có, nếu không có mới hiện chữ "Chưa có ảnh" -->
                <a th:href="@{/listings/{id}(id=${listing.id})}"
                   class="bg-white d-flex align-items-center justify-content-center border-bottom text-decoration-none overflow-hidden"
                   style="height: 200px;">
                    <img th:if="${lx != null and lx.primaryImage != null}"
                         th:src="@{${lx.primaryImage}}"
                         class="w-100 h-100"
                         style="object-fit: cover;"
                         alt="Ảnh tin đăng">
                    <span th:unless="${lx != null and lx.primaryImage != null}"
                          class="text-muted small">Chưa có ảnh</span>
                </a>

                <div class="card-body">
                    <h5 class="card-title text-truncate mb-1" th:text="${listing.title != null ? listing.title : 'Chưa có tiêu đề'}">Tiêu đề</h5>

                    <h6 class="card-subtitle mb-2 text-danger fw-bold" th:text="${listing.price != null ? #numbers.formatInteger(listing.price, 1, 'COMMA') + ' đ' : 'Thỏa thuận'}">Giá</h6>

                    <p class="card-text small text-muted mb-1" th:text="${(listing.itemCondition != null ? listing.itemCondition : 'Chưa cập nhật tình trạng') + ' · ' + (listing.location != null ? listing.location : 'Chưa có địa điểm')}">Tình trạng · Địa điểm</p>

                    <p class="card-text small text-muted" th:if="${listing.category != null}" th:text="${listing.category.name + ' · Người bán'}">Danh mục · Người bán</p>
                </div>

                <!-- Phần nút Xem chi tiết ở chân thẻ sản phẩm -->
                <div class="card-footer bg-transparent border-top-0 pb-3">
                    <a th:href="@{/listings/{id}(id=${listing.id})}" class="btn btn-outline-primary w-100">Xem chi tiết</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Cảnh báo khi không tìm thấy kết quả -->
    <div th:if="${listings == null or (listings.class.name.contains('Page') ? listings.totalElements == 0 : listings.size() == 0)}">
        <p class="text-center text-muted mt-5">Không có tin đăng nào phù hợp.</p>
    </div>

</main>

<div th:replace="~{layout/layout :: footer}"></div>
<th:block th:replace="~{layout/layout :: scripts}"></th:block>
</body>
</html>
