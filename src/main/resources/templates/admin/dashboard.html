<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head('Bảng Điều Khiển Admin')}"></head>
<body class="bg-light">
<div th:replace="~{layout/layout :: header}"></div>

<div class="container mt-4">
    <div th:replace="~{layout/layout :: flash}"></div>

    <!-- Phần tiêu đề và nút Quay lại trang chủ -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Bảng Điều Khiển Quản Trị Viên</h2>
        <a th:href="@{/}" class="btn btn-outline-secondary">⬅ Quay lại Trang chủ</a>
    </div>

    <div class="row">
        <!-- Card 1: Người dùng -->
        <div class="col-md-4 mb-3">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">
                    <h5 class="card-title">Người dùng</h5>
                    <p class="card-text">Quản lý, khóa hoặc mở khóa tài khoản.</p>
                    <a th:href="@{/admin/users}" class="btn btn-primary">Xem chi tiết</a>
                </div>
            </div>
        </div>
        <!-- Card 2: Bài đăng -->
        <div class="col-md-4 mb-3">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">
                    <h5 class="card-title">Bài đăng</h5>
                    <p class="card-text">Kiểm duyệt và ẩn các bài đăng vi phạm.</p>
                    <!-- Nút đã được đổi thành màu xanh dương (btn-primary) -->
                    <a th:href="@{/admin/listings}" class="btn btn-primary">Xem chi tiết</a>
                </div>
            </div>
        </div>
        <!-- Card 3: Báo cáo -->
        <div class="col-md-4 mb-3">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">
                    <h5 class="card-title">Báo cáo</h5>
                    <p class="card-text">Xử lý các báo cáo từ cộng đồng.</p>
                    <!-- Nút đã được đổi thành màu xanh dương (btn-primary) -->
                    <a th:href="@{/admin/reports}" class="btn btn-primary">Xem chi tiết</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/layout :: footer}"></div>
<th:block th:replace="~{layout/layout :: scripts}"></th:block>
</body>
</html>
