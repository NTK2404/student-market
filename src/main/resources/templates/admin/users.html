<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head('Quản lý Người dùng')}"></head>
<body class="bg-light">
<div th:replace="~{layout/layout :: header}"></div>

<div class="container mt-4">
    <div th:replace="~{layout/layout :: flash}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Danh sách Người dùng</h2>
        <a th:href="@{/admin/dashboard}" class="btn btn-secondary">⬅ Quay lại Dashboard</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Họ Tên</th>
                        <th>Email</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}">1</td>
                        <td th:text="${user.fullName}">Nguyễn Văn A</td>
                        <td th:text="${user.email}">nva@gmail.com</td>
                        <td>
                            <span class="badge" th:classappend="${user.status.name() == 'ACTIVE'} ? 'bg-success' : 'bg-danger'" th:text="${user.status}">ACTIVE</span>
                        </td>
                        <td>
                            <form th:if="${user.status.name() == 'ACTIVE'}" th:action="@{/admin/users/lock/{id}(id=${user.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Khóa tài khoản</button>
                            </form>
                            <form th:if="${user.status.name() == 'LOCKED'}" th:action="@{/admin/users/unlock/{id}(id=${user.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-success">Mở khóa</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/layout :: footer}"></div>
<th:block th:replace="~{layout/layout :: scripts}"></th:block>
</body>
</html>
