<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Chợ SV'">Chợ SV</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<nav th:fragment="header" class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Chợ <span>SV</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Mở menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <form class="d-flex mx-lg-3 my-2 my-lg-0 flex-grow-1" th:action="@{/listings}" method="get" role="search">
                <input class="form-control me-2" type="search" name="keyword" placeholder="Tìm đồ cũ: giáo trình, laptop, xe đạp..." aria-label="Tìm kiếm">
                <button class="btn btn-warning" type="submit">Tìm</button>
            </form>
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/login}">Đăng nhập</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-outline-light btn-sm" th:href="@{/register}">Đăng ký</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="btn btn-warning btn-sm" th:href="@{/listings/new}">+ Đăng tin</a>
                </li>
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false"
                       th:text="${currentUser != null} ? ${currentUser.fullName} : 'Tài khoản'">Tài khoản</a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/profile}">Hồ sơ của tôi</a></li>
                        <li><a class="dropdown-item" th:href="@{/my-listings}">Tin của tôi</a></li>
                        <li><a class="dropdown-item" th:href="@{/favorites}">Tin yêu thích</a></li>
                        <li sec:authorize="hasRole('ADMIN')"><hr class="dropdown-divider"></li>
                        <!-- Đã fix đường dẫn admin/dashboard tại đây -->
                        <li sec:authorize="hasRole('ADMIN')"><a class="dropdown-item" th:href="@{/admin/dashboard}">Trang quản trị</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit" class="dropdown-item text-danger">Đăng xuất</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="site-footer mt-5 py-4">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
        <div><strong>Chợ SV</strong> - Mua bán đồ cũ dành cho sinh viên</div>
        <div class="small">
            <a th:href="@{/}">Trang chủ</a> ·
            <a th:href="@{/listings}">Tất cả tin</a> ·
            <span>Đồ án môn Phát triển phần mềm</span>
        </div>
    </div>
</footer>

<div th:fragment="flash">
    <div class="alert alert-success mt-3" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger mt-3" th:if="${error}" th:text="${error}"></div>
</div>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
</body>
</html>
