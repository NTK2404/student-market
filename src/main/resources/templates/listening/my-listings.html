<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tin của tôi | Chợ SV</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

    <!-- Header chung -->
    <div th:replace="~{layout/layout :: header}"></div>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Quản lý tin đăng của tôi</h2>
            <a th:href="@{/listings/new}" class="btn btn-warning fw-bold">+ Đăng tin mới</a>
        </div>

        <div class="card shadow-sm p-3">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Tiêu đề</th>
                            <th>Giá</th>
                            <th>Trạng thái</th>
                            <th class="text-center">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${listings}">
                            <td>
                                <a th:href="@{/listings/{id}(id=${item.id})}" class="text-decoration-none fw-bold text-dark" th:text="${item.title}">Tiêu đề tin</a>
                            </td>
                            <td class="text-danger fw-bold" th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">Giá</td>
                            <td>
                                <span class="badge" 
                                      th:classappend="${item.status.name() == 'ACTIVE' ? 'bg-success' : (item.status.name() == 'PENDING' ? 'bg-warning text-dark' : 'bg-secondary')}" 
                                      th:text="${item.status}">Trạng thái</span>
                            </td>
                            <td class="text-center">
                                <!-- Nút Sửa -->
                                <a th:href="@{/listings/{id}/edit(id=${item.id})}" class="btn btn-sm btn-outline-primary me-1">Sửa</a>
                                
                                <!-- Nút Ẩn tin -->
                                <form th:action="@{/listings/{id}/status(id=${item.id})}" method="post" class="d-inline">
                                    <input type="hidden" name="status" value="HIDDEN">
                                    <button type="submit" class="btn btn-sm btn-outline-secondary me-1">Ẩn</button>
                                </form>

                                <!-- Nút Đánh dấu Đã bán -->
                                <form th:action="@{/listings/{id}/status(id=${item.id})}" method="post" class="d-inline">
                                    <input type="hidden" name="status" value="SOLD">
                                    <button type="submit" class="btn btn-sm btn-outline-success me-1">Đã bán</button>
                                </form>

                                <!-- Nút Xóa tin -->
                                <form th:action="@{/listings/{id}/delete(id=${item.id})}" method="post" class="d-inline" onsubmit="return confirm('Bạn có chắc chắn muốn xóa bài đăng này không?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Xóa</button>
                                </form>
                            </td>
                        </tr>
                        <!-- Trường hợp chưa có tin đăng nào -->
                        <tr th:if="${listings == null or #lists.isEmpty(listings)}">
                            <td colspan="4" class="text-center text-muted py-4">Bạn chưa có bài đăng nào. Hãy bấm đăng tin mới nhé!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Footer chung -->
    <div th:replace="~{layout/layout :: footer}"></div>
    <div th:replace="~{layout/layout :: scripts}"></div>

</body>
</html>
