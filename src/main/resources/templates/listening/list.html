<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tất cả tin đăng | Chợ SV</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

    <!-- Header chung -->
    <div th:replace="~{layout/layout :: header}"></div>

    <div class="container my-4">
        <h2 class="fw-bold mb-4">Danh sách chợ đồ cũ sinh viên</h2>

        <div class="row">
            <!-- Cột trái: Bộ lọc tìm kiếm -->
            <div class="col-lg-3 mb-4">
                <div class="card shadow-sm p-3">
                    <h5 class="fw-bold mb-3">Bộ lọc tìm kiếm</h5>
                    <form th:action="@{/listings}" method="get">
                        
                        <!-- Từ khóa -->
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Từ khóa</label>
                            <input type="text" class="form-control form-control-sm" name="keyword" th:value="${keyword}" placeholder="Nhập tên món đồ...">
                        </div>

                        <!-- Danh mục -->
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Danh mục</label>
                            <select class="form-select form-select-sm" name="categoryId">
                                <option value="">-- Tất cả danh mục --</option>
                                <option th:each="cat : ${categories}" 
                                        th:value="${cat.id}" 
                                        th:text="${cat.name}"
                                        th:selected="${cat.id == categoryId}">Danh mục</option>
                            </select>
                        </div>

                        <!-- Khoảng giá -->
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Giá tối thiểu (đ)</label>
                            <input type="number" class="form-control form-control-sm" name="minPrice" th:value="${minPrice}" placeholder="Từ...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Giá tối đa (đ)</label>
                            <input type="number" class="form-control form-control-sm" name="maxPrice" th:value="${maxPrice}" placeholder="Đến...">
                        </div>

                        <button type="submit" class="btn btn-primary btn-sm w-100">Áp dụng lọc</button>
                    </form>
                </div>
            </div>

            <!-- Cột phải: Hiển thị danh sách sản phẩm & Phân trang -->
            <div class="col-lg-9">
                <div class="row" th:if="${listingPage != null and !#lists.isEmpty(listingPage.content)}">
                    <div class="col-md-4 mb-3" th:each="item : ${listingPage.content}">
                        <div class="card h-100 shadow-sm">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title text-truncate" th:text="${item.title}">Tiêu đề</h5>
                                <p class="card-text text-danger fw-bold mb-2" th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">Giá</p>
                                <p class="card-text small text-muted mb-3" th:text="${item.location}">Khu vực</p>
                                <div class="mt-auto">
                                    <a th:href="@{/listings/{id}(id=${item.id})}" class="btn btn-sm btn-outline-primary w-100">Xem chi tiết</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Trường hợp không tìm thấy kết quả -->
                <div class="text-center py-5" th:if="${listingPage == null or #lists.isEmpty(listingPage.content)}">
                    <h5 class="text-muted">Không tìm thấy bài đăng nào phù hợp.</h5>
                </div>

                <!-- Phân trang -->
                <nav class="mt-4" th:if="${listingPage != null and listingPage.totalPages > 1}">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${listingPage.first ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/listings(page=${listingPage.number - 1}, keyword=${keyword}, categoryId=${categoryId}, minPrice=${minPrice}, maxPrice=${maxPrice})}">Trước</a>
                        </li>
                        <li class="page-item disabled">
                            <span class="page-link" th:text="${'Trang ' + (listingPage.number + 1) + ' / ' + listingPage.totalPages}">Trang</span>
                        </li>
                        <li class="page-item" th:classappend="${listingPage.last ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/listings(page=${listingPage.number + 1}, keyword=${keyword}, categoryId=${categoryId}, minPrice=${minPrice}, maxPrice=${maxPrice})}">Sau</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Footer chung -->
    <div th:replace="~{layout/layout :: footer}"></div>
    <div th:replace="~{layout/layout :: scripts}"></div>

</body>
</html>
