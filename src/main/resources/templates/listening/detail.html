<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${listing.title} + ' | Chợ SV'">Chi tiết tin đăng</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

    <!-- Header chung của trang -->
    <div th:replace="~{layout/layout :: header}"></div>

    <div class="container my-4">
        <div class="row">
            <!-- Cột trái: Chi tiết bài đăng & Ảnh -->
            <div class="col-lg-8">
                <div class="card shadow-sm p-3 mb-4">
                    <!-- Ảnh bài đăng (Nếu có danh sách ảnh) -->
                    <div class="mb-3 text-center bg-light p-2 rounded">
                        <img th:if="${listing.imageUrl != null}" th:src="${listing.imageUrl}" class="img-fluid rounded" style="max-height: 400px; object-fit: cover;" alt="Ảnh sản phẩm">
                        <span th:unless="${listing.imageUrl != null}" class="text-muted">Chưa có ảnh sản phẩm</span>
                    </div>

                    <h2 class="fw-bold" th:text="${listing.title}">Tiêu đề tin đăng</h2>
                    <h3 class="text-danger fw-bold" th:text="${#numbers.formatDecimal(listing.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</h3>
                    
                    <hr>
                    
                    <p><strong>Danh mục:</strong> <span th:text="${listing.category != null ? listing.category.name : 'Khác'}"></span></p>
                    <p><strong>Tình trạng:</strong> <span th:text="${listing.condition == T(com.example.studentmarket.enums.ConditionType).NEW} ? 'Mới' : 'Cũ'"></span></p>
                    <p><strong>Khu vực:</strong> <span th:text="${listing.location}">Địa điểm</span></p>
                    <p><strong>Lượt xem:</strong> <span th:text="${listing.viewCount}">0</span></p>

                    <h5 class="mt-4">Mô tả chi tiết</h5>
                    <p class="text-secondary" th:text="${listing.description}" style="white-space: pre-line;"></p>

                    <!-- Nút Thả tim / Yêu thích -->
                    <div class="mt-3">
                        <form th:action="@{/listings/{id}/favorite(id=${listing.id})}" method="post">
                            <button type="submit" class="btn btn-outline-danger">❤ Lưu tin yêu thích</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Cột phải: Thông tin người bán -->
            <div class="col-lg-4">
                <div class="card shadow-sm p-3 mb-4">
                    <h5 class="fw-bold mb-3">Thông tin người bán</h5>
                    <p><strong>Họ tên:</strong> <span th:text="${listing.seller != null ? listing.seller.fullName : 'Sinh viên FPT'}">Người bán</span></p>
                    <p><strong>Email:</strong> <span th:text="${listing.seller != null ? listing.seller.email : 'admin@market.local'}">Email</span></p>
                    <p><strong>Số điện thoại:</strong> <span th:text="${listing.seller != null ? listing.seller.phone : 'Chưa cập nhật'}">SĐT</span></p>
                </div>
            </div>
        </div>

        <!-- Tin liên quan -->
        <div class="row mt-4" th:if="${relatedListings != null and !#lists.isEmpty(relatedListings)}">
            <h4 class="fw-bold mb-3">Tin đăng liên quan</h4>
            <div class="col-md-4 mb-3" th:each="item : ${relatedListings}">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title text-truncate" th:text="${item.title}">Tiêu đề</h5>
                        <p class="card-text text-danger fw-bold" th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">Giá</p>
                        <a th:href="@{/listings/{id}(id=${item.id})}" class="btn btn-sm btn-outline-primary">Xem chi tiết</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer chung -->
    <div th:replace="~{layout/layout :: footer}"></div>
    <div th:replace="~{layout/layout :: scripts}"></div>

</body>
</html>
