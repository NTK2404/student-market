<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tin yêu thích | Chợ SV</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

    <!-- Header chung -->
    <div th:replace="~{layout/layout :: header}"></div>

    <div class="container my-4">
        <h2 class="fw-bold mb-4">Danh sách tin đăng yêu thích của bạn</h2>

        <div class="row" th:if="${favoriteListings != null and !#lists.isEmpty(favoriteListings)}">
            <div class="col-md-4 mb-3" th:each="item : ${favoriteListings}">
                <div class="card h-100 shadow-sm">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title text-truncate" th:text="${item.title}">Tiêu đề</h5>
                        <p class="card-text text-danger fw-bold mb-2" th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">Giá</p>
                        <p class="card-text small text-muted mb-3" th:text="${item.location}">Khu vực</p>
                        <div class="mt-auto">
                            <a th:href="@{/listings/{id}(id=${item.id})}" class="btn btn-sm btn-outline-primary w-100">Xem chi tiết</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Trường hợp chưa có tin yêu thích nào -->
        <div class="text-center py-5" th:if="${favoriteListings == null or #lists.isEmpty(favoriteListings)}">
            <h5 class="text-muted">Bạn chưa lưu bài đăng yêu thích nào.</h5>
            <a th:href="@{/listings}" class="btn btn-primary mt-3">Khám phá chợ ngay</a>
        </div>
    </div>

    <!-- Footer chung -->
    <div th:replace="~{layout/layout :: footer}"></div>
    <div th:replace="~{layout/layout :: scripts}"></div>

</body>
</html>
