<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head('Quên mật khẩu')}"></head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{layout/layout :: header}"></div>

<main class="container flex-grow-1 py-5">
    <div class="card auth-card">
        <div class="card-body p-4">
            <h1 class="h4 mb-2 text-center">Quên mật khẩu</h1>
            <p class="text-center text-muted">Nhập email đã đăng ký, chúng tôi sẽ gửi liên kết để đặt lại mật khẩu.</p>

            <div class="alert alert-success" th:if="${param.sent}">
                Nếu email này có trong hệ thống, chúng tôi đã gửi hướng dẫn đặt lại mật khẩu.
                Liên kết có hiệu lực 30 phút. Hãy kiểm tra cả mục Spam.
            </div>

            <form th:action="@{/forgot-password}" th:object="${forgotForm}" method="post" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="ten@email.com"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{email}">Lỗi</div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Gửi liên kết đặt lại mật khẩu</button>
            </form>

            <p class="text-center mt-3 mb-0">
                <a th:href="@{/login}">Quay lại đăng nhập</a>
            </p>
        </div>
    </div>
</main>

<div th:replace="~{layout/layout :: footer}"></div>
<th:block th:replace="~{layout/layout :: scripts}"></th:block>
</body>
</html>
