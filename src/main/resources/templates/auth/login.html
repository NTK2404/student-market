<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head('Đăng nhập')}"></head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{layout/layout :: header}"></div>

<main class="container flex-grow-1 py-5">
    <div class="card auth-card">
        <div class="card-body p-4">
            <h1 class="h4 mb-3 text-center">Đăng nhập</h1>

            <div class="alert alert-success" th:if="${param.registered}">
                Đăng ký thành công! Hãy đăng nhập bằng tài khoản vừa tạo.
            </div>
            <div class="alert alert-success" th:if="${param.reset}">
                Đặt lại mật khẩu thành công! Hãy đăng nhập bằng mật khẩu mới.
            </div>
            <div class="alert alert-info" th:if="${param.logout}">
                Bạn đã đăng xuất.
            </div>
            <div class="alert alert-danger" th:if="${param.error}">
                Email hoặc mật khẩu không đúng, hoặc tài khoản đã bị khóa.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Email</label>
                    <input type="email" class="form-control" id="username" name="username"
                           placeholder="ten@email.com" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                    <div class="text-end mt-1">
                        <a class="small" th:href="@{/forgot-password}">Quên mật khẩu?</a>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
            </form>

            <p class="text-center mt-3 mb-0">
                Chưa có tài khoản? <a th:href="@{/register}">Đăng ký</a>
            </p>
        </div>
    </div>
</main>

<div th:replace="~{layout/layout :: footer}"></div>
<th:block th:replace="~{layout/layout :: scripts}"></th:block>
</body>
</html>
