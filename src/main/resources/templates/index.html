<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Chợ đồ cũ sinh viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
    <h1>Chợ đồ cũ sinh viên</h1>
    <p sec:authorize="!isAuthenticated()">Bạn chưa đăng nhập. <a href="/login">Đăng nhập</a></p>
    <p sec:authorize="isAuthenticated()">
        Xin chào <b sec:authentication="name"></b>
    </p>
    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
        <button class="btn btn-outline-secondary btn-sm" type="submit">Đăng xuất</button>
    </form>
    <p sec:authorize="hasRole('ADMIN')" class="text-danger mt-3">Bạn đang là ADMIN.</p>
</body>
</html>
